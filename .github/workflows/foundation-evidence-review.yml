name: foundation-evidence-review

on:
  push:
    branches:
      - refactor/t00-t02-foundation
  pull_request:
    branches:
      - master
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: foundation-evidence-review
  cancel-in-progress: true

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: refactor/t00-t02-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install -e .

      - name: Apply review hardening
        run: python tools/harden_foundation_evidence.py

      - name: Run full suite
        run: python -m unittest discover -s tests -v

      - name: Remove generated and temporary files
        run: |
          rm -rf hermes_dynamic_workflows.egg-info
          rm -f tools/harden_foundation_evidence.py
          rm -f .github/workflows/foundation-evidence-review.yml

      - name: Commit reviewed foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require evidence in canonical workflow packages"
          git push origin HEAD:refactor/t00-t02-foundation
