name: foundation-refactor

on:
  push:
    branches:
      - refactor/t00-t02-foundation
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: foundation-refactor
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: refactor/t00-t02-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install -e .

      - name: Run original baseline
        id: initial
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/foundation-initial.log 2>&1
          status=$?
          cat /tmp/foundation-initial.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Repair pre-existing baseline defect
        if: steps.initial.outputs.status != '0'
        run: python tools/repair_foundation_baseline.py

      - name: Run stabilized baseline
        id: stabilized
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/foundation-stabilized.log 2>&1
          status=$?
          cat /tmp/foundation-stabilized.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop if baseline remains red
        if: steps.stabilized.outputs.status != '0'
        run: |
          echo "The stabilized baseline still fails; refusing to apply T01/T02."
          exit 1

      - name: Normalize one-shot driver path
        run: sed -i 's/test_child_agents.py/test_child_agent.py/' tools/apply_foundation_refactor.py

      - name: Apply T01 and T02
        run: python tools/apply_foundation_refactor.py apply

      - name: Run full post-change suite
        id: final
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/foundation-final.log 2>&1
          status=$?
          cat /tmp/foundation-final.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write verified foundation report
        if: always() && steps.final.outputs.status != ''
        run: |
          python tools/write_foundation_report.py \
            --base-commit "$(git merge-base HEAD origin/master)" \
            --initial-log /tmp/foundation-initial.log \
            --initial-status "${{ steps.initial.outputs.status }}" \
            --stabilized-log /tmp/foundation-stabilized.log \
            --stabilized-status "${{ steps.stabilized.outputs.status }}" \
            --final-log /tmp/foundation-final.log \
            --final-status "${{ steps.final.outputs.status }}"

      - name: Stop on regressions
        if: steps.final.outputs.status != '0'
        run: |
          echo "Post-change tests failed; refusing to commit the refactor."
          exit 1

      - name: Remove one-shot machinery
        run: |
          rm -f tools/apply_foundation_refactor.py
          rm -f tools/repair_foundation_baseline.py
          rm -f tools/write_foundation_report.py
          rm -f .github/workflows/foundation-refactor.yml

      - name: Commit verified foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: implement T00-T02 workflow foundation"
          git push origin HEAD:refactor/t00-t02-foundation
